[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simplified-genai"
version = "0.1.1"
description = "A streamlined, multi-provider Generative AI abstraction layer for Gemini, OpenAI GPT, and xAI Grok."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Daniyal", email = "57293258+DaniyalAhmadSE@users.noreply.github.com" }
]
[project.urls]
Homepage = "https://github.com/DaniyalAhmadSE/simplified-genai"

keywords = ["llm", "genai", "gemini", "openai", "grok", "ai", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "loguru>=0.7.0",
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "xai-sdk>=1.8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "twine>=5.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/simplified_genai"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

